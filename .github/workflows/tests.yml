name: tests

# Runs the full offline suite on every push and PR -- this is the gate
# publish.yml also depends on (via workflow_call) before it will publish
# anything to PyPI. Deliberately does NOT run any of the examples/live_*.py
# scripts or examples/production_readiness.py -- those need real API keys
# and network access and are excluded from tests/ for exactly that reason
# (see each script's own docstring).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, dev extras)
        run: pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest tests/ -q
