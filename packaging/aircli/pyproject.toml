[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name is "airclii", not "aircli" -- "aircli" was too
# close to an existing PyPI project name and got rejected. The
# importable Python package and the `ai` command are both unchanged --
# only the name pip install/PyPI see is different.
name = "airclii"
description = "aircli: the `ai` command -- ai run/trace for .py scripts and .airlang files, --json/--html trace output. Depends on aircore, airpy, and airlang since it drives all three from one CLI surface. PyPI distribution name is `airclii`; the importable package and `ai` command are unaffected."
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
# Dependency is on airpy's PyPI distribution name (airpyy), not its
# import name -- pip resolves dependencies by distribution name.
dependencies = ["aircore", "airpyy", "airlang"]

[project.urls]
Homepage = "https://github.com/Omerhrr/aircore"
Source = "https://github.com/Omerhrr/aircore"

[project.scripts]
# The command is `ai`, not `aircli` -- unchanged by the package rename,
# see pyproject.toml (root, dev install) for why.
ai = "aircli.__main__:main"

[tool.setuptools]
packages = ["aircli"]

[tool.setuptools.dynamic]
version = { attr = "aircli.__version__" }
