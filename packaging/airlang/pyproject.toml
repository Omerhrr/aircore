[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airlang"
description = "airlang: the AirLang declarative workflow language frontend -- lexer/parser/IR (.airlang files) plus an executor that compiles a parsed workflow to real airpy/aircore calls. Imports airpy; airpy never imports this package. See airlang-spec-v1.md."
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = ["airpy"]

[project.urls]
Homepage = "https://github.com/Omerhrr/aircore"
Source = "https://github.com/Omerhrr/aircore"

[project.scripts]
# The command is `ail`, not `airlang` -- unchanged by the package rename,
# see pyproject.toml (root, dev install) for why.
ail = "airlang.__main__:main"

[tool.setuptools]
packages = ["airlang"]

[tool.setuptools.dynamic]
version = { attr = "airlang.__version__" }
