[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name is "airpyy", not "airpy" -- "airpy" was too close
# to an existing PyPI project name and got rejected. The importable
# Python package is still `airpy` (unchanged, see [tool.setuptools] below
# and the `packages/` source dir) -- only the name pip install/PyPI see
# is different. Anyone installing this runs `pip install airpyy` but
# still writes `import airpy` in their code.
name = "airpyy"
description = "airpy: the provider-aware Python SDK layer on top of aircore -- ModelAgent, providers (MockProvider, LiteLLMProvider, native OpenAIProvider), consensus strategies, structured output, MCP tool registry, streaming, sessions, PromptTemplate. Imports aircore; aircore never imports this package. PyPI distribution name is `airpyy`; the importable package remains `airpy`."
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = ["aircore"]

[project.optional-dependencies]
# Each of these is a lazy import inside the one module that needs it --
# airpy itself has no hard dependency on any of them. See the relevant
# module's own docstring (litellm_provider.py, structured_output.py,
# mcp_tools.py, openai_provider.py) for exactly what's lazy and why.
litellm = ["litellm>=1.0"]
pydantic = ["pydantic>=2.0"]
mcp = ["mcp>=1.0"]
openai = ["openai>=1.0"]

[project.urls]
Homepage = "https://github.com/Omerhrr/aircore"
Source = "https://github.com/Omerhrr/aircore"

[tool.setuptools]
packages = ["airpy"]

[tool.setuptools.dynamic]
version = { attr = "airpy.__version__" }
